<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>Ouda Store — طباعة</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: 'Cairo', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: calc(20px + env(safe-area-inset-top)) 16px
          calc(24px + env(safe-area-inset-bottom));
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 1px;
        margin: 4px 0 14px;
        color: #cfcac0;
      }
      .paper-wrap {
        width: 100%;
        max-width: 460px;
        max-height: 58vh;
        overflow: auto;
        background: #2a2a2a;
        border-radius: 16px;
        padding: 14px;
        text-align: center;
      }
      canvas {
        display: block;
        margin: 0 auto;
        background: #fff;
        max-width: 100%;
        height: auto;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      }
      .empty {
        color: #9c9890;
        padding: 50px 0;
        font-size: 14px;
      }
      #status {
        margin: 16px 0 10px;
        min-height: 22px;
        font-size: 14px;
        color: #cfcac0;
        text-align: center;
        word-break: break-word;
        max-width: 460px;
      }
      .bar {
        width: 100%;
        max-width: 460px;
        height: 6px;
        background: #222;
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 14px;
        opacity: 0;
        transition: 0.2s;
      }
      .bar.on {
        opacity: 1;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: #fff;
        transition: width 0.1s;
      }
      button {
        width: 100%;
        max-width: 460px;
        background: #fff;
        color: #000;
        border: 0;
        border-radius: 16px;
        padding: 16px;
        font: 700 17px 'Cairo';
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.35;
      }
      button:active {
        transform: scale(0.98);
      }
      .hint {
        margin-top: 14px;
        color: #77736b;
        font-size: 12px;
        text-align: center;
        max-width: 460px;
        line-height: 1.7;
      }
      #dbg {
        margin-top: 10px;
        color: #55524c;
        font-size: 11px;
        text-align: left;
        direction: ltr;
        max-width: 460px;
        white-space: pre-wrap;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <h1>OUDA STORE · طباعة الفاتورة</h1>
    <div class="paper-wrap" id="wrap">
      <div class="empty">جاري تحميل الفاتورة...</div>
    </div>
    <div id="status"></div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <button id="go" disabled>اتصال بالطابعة وطباعة</button>
    <div class="hint">
      شغّل بلوتوث الطابعة وتأكد إنها مش متوصلة بتطبيق أو موبايل تاني، وافتح
      الصفحة دي من Bluefy.<br />اختار الطابعة من القائمة مرة واحدة وبعدها
      الطباعة بتتكرر بضغطة.
    </div>
    <div id="dbg"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const SERVICES = [
        0x18f0,
        0xff00,
        0xffe0,
        0xfee7,
        0xfff0,
        0xae00,
        0xffe5,
        0xff12,
        'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
        '49535343-fe7d-4ae5-8fa9-9fafd205e455',
        '0000ff00-0000-1000-8000-00805f9b34fb',
      ];
      // القنوات المعروفة للطابعات الحرارية (الأولوية للأعلى)
      const PREFER = [
        '00002af1',
        'ff02',
        'ffe1',
        'bef8d6c9-9c21-4c9e-b632-bd58c1009f9f',
        '49535343-8841-43f4-a8d4-ecbe34729bb3',
        'ae01',
      ];
      let bytes = null,
        dev = null,
        chars = [];

      const status = (t, bad) => {
        $('status').textContent = t;
        $('status').style.color = bad ? '#ff8a8a' : '#cfcac0';
      };
      const dbg = (t) => {
        $('dbg').textContent = t;
      };
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      const errText = (e) =>
        (e && (e.name ? e.name + ': ' : '') + (e.message || e)) || String(e);

      function fromB64Url(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        const bin = atob(s),
          u = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        return u;
      }
      async function gunzip(u8) {
        const ds = new DecompressionStream('gzip'),
          w = ds.writable.getWriter();
        w.write(u8);
        w.close();
        return new Uint8Array(await new Response(ds.readable).arrayBuffer());
      }

      /* معاينة: بنفك أوامر الصورة (GS v 0) ونرسمها */
      function preview(b) {
        let p = 2,
          bands = [],
          W = 0,
          H = 0;
        while (p + 8 <= b.length && b[p] === 0x1d && b[p + 1] === 0x76) {
          const rb = b[p + 4] | (b[p + 5] << 8),
            h = b[p + 6] | (b[p + 7] << 8);
          bands.push({ rb, h, at: p + 8 });
          W = rb * 8;
          H += h;
          p += 8 + rb * h;
        }
        if (!bands.length) throw new Error('bad');
        const c = document.createElement('canvas');
        c.width = W;
        c.height = H;
        const x = c.getContext('2d'),
          im = x.createImageData(W, H),
          d = im.data;
        let row = 0;
        bands.forEach((bd) => {
          for (let yy = 0; yy < bd.h; yy++, row++)
            for (let xx = 0; xx < W; xx++) {
              const on = b[bd.at + yy * bd.rb + (xx >> 3)] & (0x80 >> (xx & 7)),
                i = (row * W + xx) * 4;
              d[i] = d[i + 1] = d[i + 2] = on ? 0 : 255;
              d[i + 3] = 255;
            }
        });
        x.putImageData(im, 0, 0);
        $('wrap').innerHTML = '';
        $('wrap').appendChild(c);
      }

      (async () => {
        try {
          const h = location.hash.slice(1);
          if (h.length < 3) throw new Error('empty');
          let u = fromB64Url(h.slice(2));
          if (h.startsWith('g.')) u = await gunzip(u);
          bytes = u;
          preview(bytes);
          $('go').disabled = false;
          status('الفاتورة جاهزة');
        } catch (e) {
          $('wrap').innerHTML =
            '<div class="empty">مفيش فاتورة — ارجع للتطبيق واضغط طباعة</div>';
          status('', true);
        }
      })();

      /* ---------- البلوتوث ---------- */
      async function pickDevice() {
        if (!navigator.bluetooth)
          throw new Error('البلوتوث مش مدعوم هنا — افتح الصفحة من Bluefy');
        if (dev) return;
        status('اختار الطابعة...');
        dev = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: SERVICES,
        });
      }

      const rank = (c) => {
        const u = c.uuid.toLowerCase(),
          i = PREFER.findIndex((p) => u.includes(p));
        return i < 0 ? 99 : i;
      };

      // بنعيد الاتصال ونكتشف القنوات في كل طباعة (بيمنع أخطاء الـ handle القديمة)
      async function discover() {
        status('بتوصل بالطابعة...');
        try {
          if (dev.gatt.connected) {
            dev.gatt.disconnect();
            await sleep(400);
          }
        } catch (e) {}
        const srv = await dev.gatt.connect();
        chars = [];
        for (const s of await srv.getPrimaryServices()) {
          for (const c of await s.getCharacteristics()) {
            if (c.properties.writeWithoutResponse || c.properties.write)
              chars.push(c);
          }
        }
        if (!chars.length) throw new Error('مش لاقي قناة كتابة في الطابعة');
        chars.sort((a, b) => rank(a) - rank(b));
        dbg(
          'channels: ' +
            chars
              .map(
                (c) =>
                  c.uuid.slice(0, 8) +
                  (c.properties.write ? ' W' : '') +
                  (c.properties.writeWithoutResponse ? ' WNR' : ''),
              )
              .join(' | '),
        );
      }

      async function put(c, part) {
        if (c.properties.write && c.writeValueWithResponse)
          return c.writeValueWithResponse(part);
        if (c.properties.write) return c.writeValue(part);
        return c.writeValueWithoutResponse(part);
      }

      // اختبار بأمر ESC @ (تهيئة) — آمن ومش بيطبع حاجة — عشان نعرف القناة وحجم الحزمة الصح
      async function pickChannel() {
        let last;
        for (const c of chars) {
          for (const CH of [100, 20]) {
            try {
              const probe = new Uint8Array(CH);
              for (let i = 0; i < CH; i += 2) {
                probe[i] = 0x1b;
                probe[i + 1] = 0x40;
              }
              await put(c, probe);
              return { c, CH };
            } catch (e) {
              last = e;
            }
          }
        }
        throw last || new Error('الطابعة مش بتقبل بيانات');
      }

      async function send(b, ch) {
        $('bar').classList.add('on');
        for (let i = 0; i < b.length; i += ch.CH) {
          await put(ch.c, b.slice(i, i + ch.CH));
          $('fill').style.width =
            Math.round((Math.min(b.length, i + ch.CH) / b.length) * 100) + '%';
          await sleep(ch.CH > 20 ? 25 : 15);
        }
      }

      $('go').onclick = async () => {
        $('go').disabled = true;
        try {
          await pickDevice();
          await discover();
          const ch = await pickChannel();
          status('بيطبع...');
          await send(bytes, ch);
          status('تمت الطباعة ✓');
          $('go').textContent = 'اطبع تاني';
        } catch (e) {
          if (e && e.name === 'NotFoundError')
            status('اتلغى اختيار الطابعة', true);
          else status('خطأ: ' + errText(e), true);
          chars = [];
          try {
            if (dev && dev.gatt.connected) dev.gatt.disconnect();
          } catch (x) {}
        }
        setTimeout(() => $('bar').classList.remove('on'), 800);
        $('fill').style.width = '0';
        $('go').disabled = false;
      };
    </script>
  </body>
</html>

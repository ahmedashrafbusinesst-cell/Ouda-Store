<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>Ouda Store — طباعة</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        margin: 0;
        background: #000;
        color: #fff;
        font-family: 'Cairo', sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: calc(20px + env(safe-area-inset-top)) 16px
          calc(24px + env(safe-area-inset-bottom));
      }
      h1 {
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 1px;
        margin: 4px 0 14px;
        color: #cfcac0;
      }
      .paper-wrap {
        width: 100%;
        max-width: 460px;
        max-height: 58vh;
        overflow: auto;
        background: #2a2a2a;
        border-radius: 16px;
        padding: 14px;
        text-align: center;
      }
      canvas {
        display: block;
        margin: 0 auto;
        background: #fff;
        max-width: 100%;
        height: auto;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5);
      }
      .empty {
        color: #9c9890;
        padding: 50px 0;
        font-size: 14px;
      }
      #status {
        margin: 16px 0 10px;
        min-height: 22px;
        font-size: 14px;
        color: #cfcac0;
        text-align: center;
        word-break: break-word;
        max-width: 460px;
      }
      #status.ok {
        color: #7ee2a0;
      }
      #status.err {
        color: #ff8a8a;
      }
      .note {
        width: 100%;
        max-width: 460px;
        background: #1a1500;
        border: 1px solid #4a3d00;
        color: #e8d48a;
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 13px;
        line-height: 1.7;
        margin-bottom: 12px;
        display: none;
      }
      .bar {
        width: 100%;
        max-width: 460px;
        height: 6px;
        background: #222;
        border-radius: 99px;
        overflow: hidden;
        margin-bottom: 14px;
        display: none;
      }
      .bar i {
        display: block;
        height: 100%;
        width: 0;
        background: #fff;
        transition: width 0.1s;
      }
      button {
        width: 100%;
        max-width: 460px;
        background: #fff;
        color: #000;
        border: 0;
        border-radius: 16px;
        padding: 16px;
        font: 700 17px 'Cairo';
        cursor: pointer;
      }
      button.sec {
        background: #1c1c1c;
        color: #fff;
        border: 1px solid #333;
        font-size: 14px;
        padding: 12px;
        margin-top: 10px;
      }
      button:disabled {
        opacity: 0.35;
      }
      button:active {
        transform: scale(0.98);
      }
      .hint {
        margin-top: 14px;
        color: #77736b;
        font-size: 12px;
        text-align: center;
        max-width: 460px;
        line-height: 1.7;
      }
      details {
        width: 100%;
        max-width: 460px;
        margin-top: 14px;
        color: #9c9890;
        font-size: 13px;
      }
      select {
        width: 100%;
        margin-top: 8px;
        background: #111;
        color: #fff;
        border: 1px solid #333;
        border-radius: 10px;
        padding: 10px;
        font: 14px 'Cairo';
      }
    </style>
  </head>
  <body>
    <h1>OUDA STORE · طباعة الفاتورة</h1>
    <div class="paper-wrap" id="wrap">
      <div class="empty">جاري تحميل الفاتورة...</div>
    </div>
    <div id="status"></div>
    <div class="bar" id="bar"><i id="fill"></i></div>
    <div class="note" id="note"></div>
    <button id="go" disabled>اتصال بالطابعة وطباعة</button>
    <button class="sec" id="restart" style="display: none">
      ألغِ الطباعة اللي اتقطعت وابدأ من الأول
    </button>
    <button class="sec" id="alt" style="display: none">
      قناة بديلة ثم اطبع تاني
    </button>
    <div class="hint">
      شغّل بلوتوث الطابعة وتأكد إنها مش متوصلة بتطبيق أو موبايل تاني، وافتح
      الصفحة دي من Bluefy.<br />اختار الطابعة من القائمة مرة واحدة وبعدها
      الطباعة بتتكرر بضغطة.
    </div>
    <details>
      <summary>إعدادات متقدمة</summary>
      <label style="display: block; margin-top: 8px">قناة الكتابة</label>
      <select id="chSel"></select>
    </details>

    <script>
      const $ = (id) => document.getElementById(id);

      // ---------- نفس إعدادات برنت تيما الشغالة ----------
      const FIXED_CHANNEL = 1; // القناة التانية بعد الترتيب
      const CH_KEY = 'ouda_ch';
      const JOB_KEY = 'ouda_job'; // آخر طباعة (لو اتقطعت)
      const CK = 100,
        CK_FALLBACK = 20,
        DELAY = 10;
      const SERVICES = [
        '000018f0-0000-1000-8000-00805f9b34fb',
        '0000ff00-0000-1000-8000-00805f9b34fb',
        '0000ff12-0000-1000-8000-00805f9b34fb',
        '0000ffe0-0000-1000-8000-00805f9b34fb',
        '0000ffe5-0000-1000-8000-00805f9b34fb',
        '0000fff0-0000-1000-8000-00805f9b34fb',
        '0000ae30-0000-1000-8000-00805f9b34fb',
        '0000fee7-0000-1000-8000-00805f9b34fb',
        'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
        '49535343-fe7d-4ae5-8fa9-9fafd205e455',
        '6e400001-b5a3-f393-e0a9-e50e24dcca9e',
      ];

      let bytes = null,
        device = null,
        chars = [],
        idx = 0,
        JOB_ID = '',
        LAY = null,
        printedOnce = false;

      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
      function ls(k, v) {
        try {
          if (v === undefined) return localStorage.getItem(k);
          if (v === null) return localStorage.removeItem(k);
          localStorage.setItem(k, v);
        } catch (e) {}
      }
      function st(t, cls) {
        const e = $('status');
        if (!cls) e.dataset.stage = t;
        e.textContent = t;
        e.className = cls || '';
      }
      function prog(p) {
        const b = $('bar');
        b.style.display = p == null ? 'none' : 'block';
        $('fill').style.width = (p || 0) + '%';
      }
      function withTimeout(p, ms, label) {
        return Promise.race([
          p,
          new Promise((_, rej) =>
            setTimeout(
              () => rej(new Error('انتهى الوقت في مرحلة: ' + label)),
              ms,
            ),
          ),
        ]);
      }
      function errText(e) {
        let name = (e && e.name) || typeof e,
          msg = '';
        try {
          msg =
            (e && e.message) || (typeof e === 'string' ? e : JSON.stringify(e));
        } catch (x) {
          msg = String(e);
        }
        return '[' + name + '] ' + msg;
      }

      function fromB64Url(s) {
        s = s.replace(/-/g, '+').replace(/_/g, '/');
        while (s.length % 4) s += '=';
        const bin = atob(s),
          u = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        return u;
      }
      async function gunzip(u8) {
        const ds = new DecompressionStream('gzip'),
          w = ds.writable.getWriter();
        w.write(u8);
        w.close();
        return new Uint8Array(await new Response(ds.readable).arrayBuffer());
      }

      /* ---------- هيكل الفاتورة (شرايح الصورة) ---------- */
      function layout(b) {
        const bands = [];
        let p = 2;
        while (p + 8 <= b.length && b[p] === 0x1d && b[p + 1] === 0x76) {
          const rb = b[p + 4] | (b[p + 5] << 8),
            h = b[p + 6] | (b[p + 7] << 8);
          const e = p + 8 + rb * h;
          bands.push({ s: p, e, rb, h });
          p = e;
        }
        return { bands, bodyEnd: p };
      }
      // لو الإرسال وقف عند البايت pos: كام بايت فاضي نكمّل بيهم الأمر الحالي، وإحنا نكمل منين
      function plan(pos) {
        const len = bytes.length;
        if (pos <= 0) return { pad: 0, start: 0 };
        if (pos < 2) return { pad: 2, start: 0 };
        if (pos >= len) return { pad: 0, start: len };
        for (const b of LAY.bands) {
          if (pos <= b.s) return { pad: 0, start: pos };
          if (pos < b.e) return { pad: b.e - pos, start: b.e };
        }
        if (pos === LAY.bodyEnd) return { pad: 0, start: pos };
        return { pad: 4, start: LAY.bodyEnd };
      }
      function hashBytes(b) {
        let h = 0x811c9dc5;
        for (let i = 0; i < b.length; i++) {
          h ^= b[i];
          h = Math.imul(h, 0x01000193);
        }
        return b.length + '-' + (h >>> 0).toString(36);
      }

      /* ---------- حفظ حالة الطباعة (عشان لو اتقطعت) ---------- */
      function getJob() {
        try {
          return JSON.parse(ls(JOB_KEY) || 'null');
        } catch (e) {
          return null;
        }
      }
      function saveJob(pos) {
        ls(
          JOB_KEY,
          JSON.stringify({
            id: JOB_ID,
            total: bytes.length,
            pos,
            pad: plan(pos).pad,
            t: Date.now(),
          }),
        );
      }
      function clearJob() {
        ls(JOB_KEY, null);
      }
      function interrupted() {
        const j = getJob();
        return j && j.pos < j.total ? j : null;
      }

      function updateUI() {
        if (!bytes) return;
        const j = interrupted(),
          same = j && j.id === JOB_ID;
        const pct = j ? Math.round((j.pos * 100) / j.total) : 0;
        $('restart').style.display = same ? '' : 'none';
        $('go').textContent = same
          ? 'كمّل الطباعة (' + pct + '%)'
          : printedOnce
            ? 'اطبع تاني'
            : 'اتصال بالطابعة وطباعة';
        const n = $('note');
        if (same) {
          n.style.display = 'block';
          n.textContent =
            'الطباعة اتقطعت عند ' +
            pct +
            '%. "كمّل" بيكمل الباقي (ممكن يظهر فراغ أبيض صغير حوالي 8 مم عند مكان القطع). لو الطابعة اتطفت أو اتعمل لها إعادة تشغيل اختار "ألغِ وابدأ من الأول".';
        } else if (j) {
          n.style.display = 'block';
          n.textContent =
            'فيه طباعة قديمة اتقطعت. هتتلغي تلقائي قبل ما تبدأ الطباعة دي.';
        } else {
          n.style.display = 'none';
        }
      }

      /* معاينة: بنفك أوامر الصورة (GS v 0) ونرسمها */
      function preview(b) {
        const L = layout(b),
          bands = L.bands;
        if (!bands.length) throw new Error('bad');
        const W = bands[0].rb * 8,
          H = bands.reduce((s, x) => s + x.h, 0);
        const c = document.createElement('canvas');
        c.width = W;
        c.height = H;
        const x = c.getContext('2d'),
          im = x.createImageData(W, H),
          d = im.data;
        let row = 0;
        bands.forEach((bd) => {
          for (let yy = 0; yy < bd.h; yy++, row++)
            for (let xx = 0; xx < W; xx++) {
              const on =
                  b[bd.s + 8 + yy * bd.rb + (xx >> 3)] & (0x80 >> (xx & 7)),
                i = (row * W + xx) * 4;
              d[i] = d[i + 1] = d[i + 2] = on ? 0 : 255;
              d[i + 3] = 255;
            }
        });
        x.putImageData(im, 0, 0);
        $('wrap').innerHTML = '';
        $('wrap').appendChild(c);
      }

      (async () => {
        try {
          const h = location.hash.slice(1);
          if (h.length < 3) throw new Error('empty');
          let u = fromB64Url(h.slice(2));
          if (h.startsWith('g.')) u = await gunzip(u);
          bytes = u;
          LAY = layout(bytes);
          JOB_ID = hashBytes(bytes);
          preview(bytes);
          $('go').disabled = false;
          st('الفاتورة جاهزة');
          updateUI();
        } catch (e) {
          $('wrap').innerHTML =
            '<div class="empty">مفيش فاتورة — ارجع للتطبيق واضغط طباعة</div>';
          st('', 'err');
        }
      })();

      /* ---------- البلوتوث (منقول من برنت تيما) ---------- */
      function score(c) {
        const u = (c.service && c.service.uuid) || '';
        if (u.indexOf('000018f0') === 0) return 0;
        if (u.indexOf('e7810a71') === 0) return 1;
        if (u.indexOf('49535343') === 0) return 2;
        return 3;
      }
      function shortUuid(u) {
        u = String(u || '');
        return u.indexOf('0000') === 0 &&
          u.slice(8) === '-0000-1000-8000-00805f9b34fb'
          ? u.slice(4, 8)
          : u.slice(0, 8);
      }
      function fillCh() {
        const sel = $('chSel');
        sel.innerHTML = '';
        chars.forEach((c, i) => {
          const p = [];
          if (c.properties.write) p.push('W');
          if (c.properties.writeWithoutResponse) p.push('WNR');
          const o = document.createElement('option');
          o.value = i;
          o.textContent =
            i +
            1 +
            ') ' +
            shortUuid(c.service && c.service.uuid) +
            ' / ' +
            shortUuid(c.uuid) +
            ' [' +
            p.join('+') +
            ']';
          sel.appendChild(o);
        });
        sel.value = idx;
      }
      function onCh() {
        const v = parseInt($('chSel').value, 10);
        if (v >= 0 && v < chars.length) idx = v;
      }
      $('chSel').onchange = onCh;

      function ready() {
        return !!(
          device &&
          device.gatt &&
          device.gatt.connected &&
          chars.length
        );
      }

      async function openGatt() {
        try {
          st('2/4 جاري الاتصال بالطابعة...');
          const server = await withTimeout(
            device.gatt.connect(),
            20000,
            'الاتصال بالطابعة',
          );
          st('3/4 جاري قراءة الخدمات...');
          const svcs = await withTimeout(
            server.getPrimaryServices(),
            20000,
            'قراءة الخدمات',
          );
          st('4/4 جاري تجهيز قناة الكتابة...');
          chars = [];
          for (const s of svcs) {
            const cs = await withTimeout(
              s.getCharacteristics(),
              20000,
              'قراءة القنوات',
            );
            cs.forEach((c) => {
              if (c.properties.write || c.properties.writeWithoutResponse)
                chars.push(c);
            });
          }
          if (!chars.length)
            throw new Error('الطابعة اتصلت بس مفيش قناة كتابة.');
          chars.sort((a, b) => score(a) - score(b));
          const saved = parseInt(ls(CH_KEY), 10);
          idx =
            saved >= 0 && saved < chars.length
              ? saved
              : FIXED_CHANNEL < chars.length
                ? FIXED_CHANNEL
                : 0;
          fillCh();
        } catch (e) {
          try {
            device.gatt.disconnect();
          } catch (x) {}
          throw e;
        }
      }

      async function requestWithFallback() {
        const short = [
          '000018f0-0000-1000-8000-00805f9b34fb',
          '0000ffe0-0000-1000-8000-00805f9b34fb',
          '49535343-fe7d-4ae5-8fa9-9fafd205e455',
        ];
        const attempts = [
          {
            label: 'قايمة كاملة',
            opts: { acceptAllDevices: true, optionalServices: SERVICES },
          },
          {
            label: 'قايمة مختصرة',
            opts: { acceptAllDevices: true, optionalServices: short },
          },
          { label: 'من غير خدمات', opts: { acceptAllDevices: true } },
        ];
        let lastErr;
        const tried = [];
        for (const a of attempts) {
          try {
            st('1/4 اختار الطابعة من القايمة... (' + a.label + ')');
            return await navigator.bluetooth.requestDevice(a.opts);
          } catch (e) {
            lastErr = e;
            tried.push(a.label + ': ' + errText(e));
            if (e && e.name === 'NotFoundError') throw e;
          }
        }
        const err = new Error('فشلت كل الطرق → ' + tried.join(' || '));
        err.name = (lastErr && lastErr.name) || 'Error';
        throw err;
      }

      async function connectFlow() {
        if (!navigator.bluetooth)
          throw new Error(
            'المتصفح مش بيدعم البلوتوث — افتح الصفحة من تطبيق Bluefy',
          );
        if (device) {
          try {
            await openGatt();
            return;
          } catch (e) {
            device = null;
          }
        }
        device = await requestWithFallback();
        device.addEventListener('gattserverdisconnected', () => {
          chars = [];
        });
        await openGatt();
      }

      // كتابة بنفس منطق تيما. track=true بيحفظ مكان الوقوف بعد كل حزمة، quiet=true من غير شريط تقدم
      async function write(data, from, track, quiet) {
        const c = chars[idx];
        const canNoResp =
          !!c.properties.writeWithoutResponse && !!c.writeValueWithoutResponse;
        const canResp = !!c.properties.write;
        let useNoResp = !canResp && canNoResp;
        let ck = CK,
          pos = from || 0;
        while (pos < data.length) {
          const part = data.slice(pos, pos + ck);
          try {
            if (useNoResp) await c.writeValueWithoutResponse(part);
            else if (c.writeValueWithResponse)
              await c.writeValueWithResponse(part);
            else await c.writeValue(part);
            pos += part.length;
            if (track) saveJob(pos);
            if (!quiet) {
              const pc = Math.round((pos * 100) / data.length);
              prog(pc);
              st('جاري الطباعة... ' + pc + '%');
            }
            if (DELAY) await sleep(DELAY);
          } catch (e) {
            if (ck > CK_FALLBACK) {
              ck = CK_FALLBACK;
              continue;
            }
            if (useNoResp && canResp) {
              useNoResp = false;
              continue;
            }
            throw e;
          }
        }
      }

      // إلغاء طباعة اتقطعت: نكمل الأمر الحالي بأصفار (بتتجاهلها الطابعة) وبعدين نعمل ريسيت
      async function flush(pad) {
        st('بيلغي الطباعة اللي اتقطعت...');
        if (pad > 0) await write(new Uint8Array(pad), 0, false, true);
        await write(Uint8Array.of(0x1b, 0x40), 0, false, true);
        await sleep(200);
      }

      async function run(mode) {
        const btn = $('go'),
          rs = $('restart');
        btn.disabled = true;
        rs.disabled = true;
        $('alt').style.display = 'none';
        try {
          if (!ready()) await connectFlow();
          onCh();
          const j = interrupted(),
            same = j && j.id === JOB_ID;
          let from = 0;
          if (j && (!same || mode === 'restart')) {
            await flush(j.pad || 0); // طباعة قديمة أو طلب "ابدأ من الأول"
            clearJob();
          } else if (same && mode === 'resume') {
            const p = plan(j.pos);
            if (p.pad > 0) {
              st('بيكمل من مكان الوقوف...');
              await write(new Uint8Array(p.pad), 0, false, true);
            }
            from = p.start;
          }
          prog(from ? Math.round((from * 100) / bytes.length) : 0);
          st('جاري الطباعة...');
          saveJob(from);
          await write(bytes, from, true, false);
          clearJob();
          ls(CH_KEY, String(idx));
          prog(100);
          st('✔ تمت الطباعة', 'ok');
          printedOnce = true;
        } catch (e) {
          prog(null);
          if (e && e.name === 'NotFoundError')
            st('اتلغى اختيار الطابعة', 'err');
          else
            st(
              '❌ ' +
                errText(e) +
                ' | مرحلة: ' +
                ($('status').dataset.stage || '?'),
              'err',
            );
          if (chars.length > 1) $('alt').style.display = '';
        } finally {
          btn.disabled = false;
          rs.disabled = false;
          updateUI();
        }
      }
      function altChannel() {
        if (chars.length < 2) return;
        idx = (idx + 1) % chars.length;
        $('chSel').value = idx;
        st(
          'اتغيّرت القناة لـ ' + (idx + 1) + '/' + chars.length + ' — بيطبع...',
        );
        run('restart');
      }
      $('go').onclick = () => {
        const j = interrupted();
        run(j && j.id === JOB_ID ? 'resume' : 'auto');
      };
      $('restart').onclick = () => run('restart');
      $('alt').onclick = altChannel;
    </script>
  </body>
</html>
